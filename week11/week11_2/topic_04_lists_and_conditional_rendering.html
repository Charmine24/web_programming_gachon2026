<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Topic 4 | Lists and Conditional Rendering</title>
  <style>
    /* Back button: same look as .back-button in style.css */
    .back-button { position: fixed; top: 20px; left: 20px; z-index: 10; display: inline-flex; width: 96px; height: 40px; margin: 0; align-items: center; justify-content: center; padding: 0; border: 1px solid #d8eaf3; border-radius: 999px; color: #3f4661; background: #fffefe; cursor: pointer; font: 700 .86rem/1 "Trebuchet MS", sans-serif; text-align: center; appearance: none; }
    .back-button:hover, .back-button:focus-visible { border-color: #b46682; color: #b46682; }
    body { padding-top: 76px; }
  </style>
</head>
<body>
  <button class="back-button" type="button" onclick="history.back()">Back</button>
  <main id="app"></main>
  <script>
    const courses = [
      { id: 1, name: 'Web Programming', credits: 3 },
      { id: 2, name: 'Databases', credits: 3 },
      { id: 3, name: 'Algorithms', credits: 4 },
    ];
    const courseList = () => `<ul>${courses.map((course) => `<li>${course.name} — ${course.credits} credits</li>`).join('')}</ul>`;
    const userGreeting = ({ isLoggedIn, username }) =>
      isLoggedIn ? `<h1>Welcome back, ${username}!</h1><button>Log out</button>` : '<h1>Please log in</h1>';
    const dashboard = ({ isAdmin }) => isAdmin ? '<p>Admin panel</p>' : '<p>Access denied</p>';
    document.getElementById('app').innerHTML =
      courseList() + userGreeting({ isLoggedIn: true, username: 'Charmine' }) +
      userGreeting({ isLoggedIn: false }) + dashboard({ isAdmin: true }) + dashboard({ isAdmin: false });
  </script>
</body>
</html>
