<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Topic 5 | Component Composition</title>
  <style>
    .student-list { display: flex; gap: 1rem; flex-wrap: wrap; font: 1rem sans-serif; }
    .card { width: 220px; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
    .badge { padding: 2px 8px; border-radius: 4px; color: white; background: #0891b2; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const avatar = ({ src, alt }) => `<img class="avatar" src="${src}" alt="${alt}">`;
    const badge = ({ text, color = '#0891b2' }) => `<span class="badge" style="background:${color}">${text}</span>`;
    const studentCard = ({ name, studentId, year, avatarUrl }) =>
      `<article class="card">${avatar({ src: avatarUrl, alt: name })}<h3>${name}</h3><p>ID: ${studentId}</p>${badge({ text: `Year ${year}` })}</article>`;
    document.getElementById('app').innerHTML = `<div class="student-list">${
      studentCard({ name: 'Amir', studentId: '202011234', year: 3, avatarUrl: '/img/amir.jpg' })
    }${studentCard({ name: 'Zulfiya', studentId: '202012345', year: 2, avatarUrl: '/img/zulfiya.jpg' })}</div>`;
  </script>
</body>
</html>
