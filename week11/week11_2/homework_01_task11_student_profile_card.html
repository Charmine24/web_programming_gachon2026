<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homework | Student Profile Card</title>
  <style>
    body { margin: 0; background-color: #f2f4f7; font-family: system-ui, sans-serif; color: #1f2933; }
    .directory { max-width: 640px; margin: 2.5rem auto; padding: 0 1rem; }
    .directory h1 { text-align: center; margin-bottom: 1.5rem; }
    .profile-card { background-color: #fff; border: 1px solid #d0d7e2; border-radius: 12px; padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; box-shadow: 0 2px 6px rgba(0, 0, 0, .06); }
    .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e4e8ef; padding-bottom: .75rem; margin-bottom: .75rem; }
    .student-name { margin: 0; font-size: 1.25rem; }
    .student-id { background-color: #e8f0fe; color: #1a56db; font-size: .85rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
    .card-body p { margin: .35rem 0; }
  </style>
</head>
<body>
  <main class="directory" id="app"></main>
  <script>
    const studentProfileCard = ({ name, studentId, major, year, gpa }) => `
      <article class="profile-card">
        <div class="card-header"><h2 class="student-name">${name}</h2><span class="student-id">ID: ${studentId}</span></div>
        <div class="card-body"><p><strong>Major:</strong> ${major}</p><p><strong>Year:</strong> ${year}</p><p><strong>GPA:</strong> ${gpa}</p></div>
      </article>`;
    const students = [
      { name: 'Yang Kaijing Charmine', studentId: '202699477', major: 'Computer Engineering', year: 3, gpa: 3.75 },
      { name: 'TODO', studentId: 'TODO', major: 'TODO', year: 2, gpa: 3.5 },
      { name: 'TODO', studentId: 'TODO', major: 'TODO', year: 4, gpa: 3.9 },
    ];
    document.getElementById('app').innerHTML = `<h1>Student Directory</h1>${students.map(studentProfileCard).join('')}`;
  </script>
</body>
</html>
