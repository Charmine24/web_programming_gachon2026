<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 1 | Profile Card</title>
  <style>
    .profile-card { max-width: 300px; padding: 16px; border: 1px solid #ccc; border-radius: 8px; font: 1rem sans-serif; }
    .profile-card img { width: 80px; border-radius: 50%; }
  </style>
  <style>
    /* Back button: same look as .back-button in style.css */
    .back-button { position: fixed; top: 20px; left: 20px; z-index: 10; display: inline-flex; width: 96px; height: 40px; margin: 0; align-items: center; justify-content: center; padding: 0; border: 1px solid #d8eaf3; border-radius: 999px; color: #3f4661; background: #fffefe; cursor: pointer; font: 700 .86rem/1 "Trebuchet MS", sans-serif; text-align: center; appearance: none; }
    .back-button:hover, .back-button:focus-visible { border-color: #b46682; color: #b46682; }
    body { padding-top: 76px; }
  </style>
</head>
<body>
  <button class="back-button" type="button" onclick="history.back()">Back</button>
  <main id="app"></main>
  <script>
    const profileCard = ({ name, role, email, avatarUrl = 'https://placehold.co/80x80' }) =>
      `<article class="profile-card"><img src="${avatarUrl}" alt="${name}"><h2>${name}</h2><p>${role}</p><a href="mailto:${email}">${email}</a></article>`;
    document.getElementById('app').innerHTML = profileCard({
      name: 'Dr. Toshpulatov', role: 'Professor', email: 'muhiddin@gachon.ac.kr',
    });
  </script>
</body>
</html>
