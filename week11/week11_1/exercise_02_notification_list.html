<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 2 | Notification List</title>
  <style>
    /* Back button: same look as .back-button in style.css */
    .back-button { position: fixed; top: 20px; left: 20px; z-index: 10; display: inline-flex; width: 96px; height: 40px; margin: 0; align-items: center; justify-content: center; padding: 0; border: 1px solid #d8eaf3; border-radius: 999px; color: #3f4661; background: #fffefe; cursor: pointer; font: 700 .86rem/1 "Trebuchet MS", sans-serif; text-align: center; appearance: none; }
    .back-button:hover, .back-button:focus-visible { border-color: #b46682; color: #b46682; }
    body { padding-top: 76px; }
  </style>
</head>
<body>
  <button class="back-button" type="button" onclick="history.back()">Back</button>
  <main>
    <h1>Notifications</h1>
    <ul id="notifications"></ul>
  </main>
  <script>
    const notifications = [
      { id: 1, type: 'success', message: 'Profile updated successfully' },
      { id: 2, type: 'warning', message: 'Password expires in 3 days' },
      { id: 3, type: 'info', message: 'New lecture materials available' },
    ];
    const icons = { success: '✅', warning: '⚠️', info: 'ℹ️' };
    document.getElementById('notifications').innerHTML = notifications
      .map(({ type, message }) => `<li>${icons[type]} ${message}</li>`).join('');
  </script>
</body>
</html>
