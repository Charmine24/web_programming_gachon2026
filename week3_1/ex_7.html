<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    /* TODO: write all CSS here */
    /* Hint: start with body, then .card, then .avatar, .name, .role, hr, .skills, .badge */
/* Global Page Styling */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f4f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Card Container */
    .card {
      background-color: #ffffff;
      width: 300px;
      padding: 30px 24px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    /* Avatar Circle */
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: #10b981;
      color: #ffffff;
      font-size: 2rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 16px auto;
    }

    /* User Name */
    .name {
      margin: 0 0 6px 0;
      font-size: 1.5rem;
      font-weight: 700;
      color: #1f2937;
    }

    /* Role Text */
    .role {
      margin: 0 0 20px 0;
      font-size: 0.95rem;
      color: #6b7280;
    }

    /* Divider Line */
    hr {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 0 0 20px 0;
    }

    /* Skills Container (Flexbox) */
    .skills {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Skill Badges */
    .badge {
      background-color: #10b981;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">YKC</div>
    <h2 class="name">Yang Kaijing Charmine</h2>
    <p class="role">Cybersecurity Student</p>
    <hr>
    <div class="skills">
      <span class="badge">HTML5</span>
      <span class="badge">CSS3</span>
      <span class="badge">Flexbox</span>
    </div>
  </div>
</body>
</html>
