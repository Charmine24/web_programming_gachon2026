<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 1 | Joke Generator</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f0f4ff; color: #1a2340; display: flex; justify-content: center; padding: 60px 16px; margin: 0; }
    .card { background: white; max-width: 480px; width: 100%; padding: 32px; border-radius: 16px; box-shadow: 0 4px 20px #00000014; text-align: center; }
    button { background: #f7df1e; border: 0; padding: 12px 24px; font-weight: bold; border-radius: 10px; cursor: pointer; }
    #result { margin-top: 24px; min-height: 60px; } #status { color: #5a6a8a; } .error { color: #dc2626 !important; }
  </style>
  <link rel="stylesheet" href="../../style.css">
</head>
<body>
	<button class="back-button" type="button" onclick="history.back()">Back</button>
  <main class="card">
    <h1>😂 Joke Generator</h1>
    <p>Scenario: give visitors a quick icebreaker.</p>
    <button id="load-button">Load a joke</button>
    <div id="result"></div><p id="status" aria-live="polite"></p>
  </main>
  <script>
    const button = document.querySelector("#load-button");
    const result = document.querySelector("#result");
    const status = document.querySelector("#status");
    button.addEventListener("click", async () => {
      button.disabled = true; status.className = ""; status.textContent = "Loading...";
      try {
        const response = await fetch("https://official-joke-api.appspot.com/random_joke");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        result.innerHTML = `<p><strong>${data.setup}</strong></p><p>${data.punchline}</p>`;
        status.textContent = "";
      } catch (error) {
        status.className = "error"; status.textContent = "Could not load a joke. Try again.";
        console.error(error);
      } finally { button.disabled = false; }
    });
  </script>
</body>
</html>
