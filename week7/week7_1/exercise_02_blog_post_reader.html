<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 2 | Blog Post Reader</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #fff7ed; color: #431407; display: flex; justify-content: center; padding: 60px 16px; margin: 0; }
    .card { background: white; max-width: 560px; width: 100%; padding: 32px; border-radius: 16px; box-shadow: 0 4px 20px #00000014; } button { background: #ea580c; color: white; border: 0; padding: 12px 24px; border-radius: 10px; cursor: pointer; } #post { margin-top: 24px; } #status { color: #9a3412; } .error { color: #dc2626 !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1>📰 Blog Post Reader</h1>
    <p>Scenario: preview a featured article on a news homepage.</p>
    <button id="load-button">Load featured post</button>
    <article id="post"></article><p id="status" aria-live="polite"></p>
  </main>
  <script>
    const button = document.querySelector("#load-button"), post = document.querySelector("#post"), status = document.querySelector("#status");
    button.addEventListener("click", async () => {
      button.disabled = true; status.className = ""; status.textContent = "Loading article...";
      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/posts/1");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        post.innerHTML = `<h2>${data.title}</h2><p>${data.body}</p><small>Post #${data.id} · User #${data.userId}</small>`;
        status.textContent = "";
      } catch (error) { status.className = "error"; status.textContent = "The article is unavailable."; console.error(error); }
      finally { button.disabled = false; }
    });
  </script>
</body>
</html>
