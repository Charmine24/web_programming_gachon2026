<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 4 | User Profile Card</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #fdf2f8; color: #500724; display: flex; justify-content: center; padding: 60px 16px; margin: 0; } .card { background: white; max-width: 480px; width: 100%; padding: 32px; border-radius: 16px; box-shadow: 0 4px 20px #00000014; text-align: center; } button { background: #db2777; color: white; border: 0; padding: 12px 24px; border-radius: 10px; cursor: pointer; } #profile { margin-top: 24px; } #profile img { width: 130px; border-radius: 50%; } #status { color: #9d174d; } .error { color: #dc2626 !important; }
  </style>
  <link rel="stylesheet" href="../../style.css">
</head>
<body>
	<button class="back-button" type="button" onclick="history.back()">Back</button>
  <main class="card">
    <h1>👤 Community Member</h1>
    <p>Scenario: fill a welcome card with a randomly selected member.</p>
    <button id="load-button">Find a member</button>
    <section id="profile"></section><p id="status" aria-live="polite"></p>
  </main>
  <script>
    const button = document.querySelector("#load-button"), profile = document.querySelector("#profile"), status = document.querySelector("#status");
    button.addEventListener("click", async () => {
      button.disabled = true; status.className = ""; status.textContent = "Finding a member...";
      try {
        const response = await fetch("https://randomuser.me/api");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json(), user = data.results[0];
        profile.innerHTML = `<img src="${user.picture.large}" alt="Profile photo of ${user.name.first}"><h2>${user.name.first}</h2><p>${user.email}</p>`;
        status.textContent = "";
      } catch (error) { status.className = "error"; status.textContent = "The member profile is unavailable."; console.error(error); }
      finally { button.disabled = false; }
    });
  </script>
</body>
</html>
