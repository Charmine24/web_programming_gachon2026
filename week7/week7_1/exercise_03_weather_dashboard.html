<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 3 | Seoul Weather</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #eff6ff; color: #172554; display: flex; justify-content: center; padding: 60px 16px; margin: 0; } .card { background: white; max-width: 480px; width: 100%; padding: 32px; border-radius: 16px; box-shadow: 0 4px 20px #00000014; text-align: center; } button { background: #2563eb; color: white; border: 0; padding: 12px 24px; border-radius: 10px; cursor: pointer; } #weather { margin-top: 24px; font-size: 18px; } #status { color: #1d4ed8; } .error { color: #dc2626 !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🌤️ Seoul Weather</h1>
    <p>Scenario: show the current conditions before a day trip.</p>
    <button id="load-button">Check weather</button>
    <section id="weather"></section><p id="status" aria-live="polite"></p>
  </main>
  <script>
    const button = document.querySelector("#load-button"), weather = document.querySelector("#weather"), status = document.querySelector("#status");
    button.addEventListener("click", async () => {
      button.disabled = true; status.className = ""; status.textContent = "Checking Seoul...";
      try {
        const response = await fetch("https://api.open-meteo.com/v1/forecast?latitude=37.57&longitude=126.98&current_weather=true");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        weather.innerHTML = `<h2>${data.current_weather.temperature}°C</h2><p>Wind: ${data.current_weather.windspeed} km/h</p><small>Seoul · ${data.current_weather.time}</small>`;
        status.textContent = "";
      } catch (error) { status.className = "error"; status.textContent = "Weather data could not be loaded."; console.error(error); }
      finally { button.disabled = false; }
    });
  </script>
</body>
</html>
