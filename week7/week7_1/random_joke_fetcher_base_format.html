<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page fit nicely on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Joke Fetcher</title>
 
  <style>
    /* Page background and font */
    body {
      font-family: system-ui, sans-serif;
      background: #f0f4ff;
      color: #1a2340;
      display: flex;
      justify-content: center;   /* center horizontally */
      padding: 60px 16px;
      margin: 0;
    }
 
    /* White card that holds everything */
    .card {
      background: white;
      max-width: 480px;
      width: 100%;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
 
    h1 { margin-top: 0; }
 
    /* Buttons */
    button {
      background: #f7df1e;
      color: #3a3000;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      margin: 4px;
    }
    button:hover    { filter: brightness(1.08); }
    button:disabled { opacity: 0.5; cursor: default; }  /* greyed out */
    #save-btn       { background: #1a56db; color: white; }
 
    /* Area where the joke appears */
    #joke-area { margin-top: 24px; min-height: 60px; }
    .setup     { font-size: 18px; font-weight: bold; }
    .punchline { font-size: 17px; color: #1a56db; }
 
    /* Loading / error text */
    #status       { color: #5a6a8a; }
    #status.error { color: #dc2626; }   /* red when something goes wrong */
 
    /* ── CHALLENGE: spinner ──
       A circle with one blue side, spinning forever */
    .spinner {
      width: 28px;
      height: 28px;
      margin: 16px auto 0;
      border: 4px solid #dbeafe;        /* light ring */
      border-top-color: #1a56db;        /* one dark side = the "spinning" part */
      border-radius: 50%;               /* make it a circle */
      animation: spin 0.8s linear infinite;
      display: none;                    /* hidden until we're loading */
    }
    @keyframes spin {
      to { transform: rotate(360deg); } /* one full turn */
    }
 
    /* ── EXTRA: favourites list ── */
    .favourites    { text-align: left; margin-top: 28px; border-top: 1px solid #e5e7eb; padding-top: 16px; }
    .favourites h2 { font-size: 18px; margin: 0 0 8px; }
    #fav-list li   { margin-bottom: 10px; }
    #fav-list span { color: #5a6a8a; }
  </style>
</head>
<body>
 
  <div class="card">
    <h1>😂 Random Joke</h1>
 
    <!-- REQUIRED: a button that calls loadJoke() -->
    <button id="joke-btn" onclick="loadJoke()">Load a Joke</button>
 
    <!-- EXTRA: save the current joke (disabled until a joke is loaded) -->
    <button id="save-btn" onclick="saveFavourite()" disabled>⭐ Save Favourite</button>
 
    <!-- CHALLENGE: the spinner (hidden by CSS until loading) -->
    <div class="spinner" id="spinner"></div>
 
    <!-- Where the joke will appear -->
    <div id="joke-area"></div>
 
    <!-- Loading and error text -->
    <p id="status"></p>
 
    <!-- EXTRA: list of saved jokes -->
    <div class="favourites">
      <h2>⭐ Favourites</h2>
      <ul id="fav-list"></ul>
    </div>
  </div>
 
  <script>
    // Remembers the joke on screen, so "Save Favourite" knows what to save
    let currentJoke = null;
 
    // ═══════════════════════════════════
    //  Load a joke (fetch + async/await)
    // ═══════════════════════════════════
 
    // "async" lets us use "await" inside this function
    async function loadJoke() {
 
      // Grab the elements we need to change
      const btn     = document.getElementById('joke-btn');
      const saveBtn = document.getElementById('save-btn');
      const spinner = document.getElementById('spinner');
      const status  = document.getElementById('status');
      const area    = document.getElementById('joke-area');
 
      // Step 1: show loading + spinner, disable buttons while we wait
      btn.disabled          = true;
      saveBtn.disabled      = true;
      spinner.style.display = 'block';    // show the spinner
      status.className      = '';         // remove red error style if it was there
      status.textContent    = 'Loading…';
 
      // "try" = run this code, but be careful
      try {
 
        // Step 2: ask the joke server for a joke
        // "await" = wait here until the server answers
        const res = await fetch('https://official-joke-api.appspot.com/random_joke');
 
        // Step 3: fetch() does NOT throw on 404/500, so check it ourselves
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
 
        // Step 4: turn the response into a JS object — also a Promise, so await it
        // data looks like: { id: 27, setup: "...", punchline: "..." }
        const data = await res.json();
 
        // Step 5: show the setup and punchline in separate elements
        area.innerHTML =
          `<p class="setup">${data.setup}</p>
           <p class="punchline">${data.punchline}</p>`;
 
        // Remember this joke and allow saving it
        currentJoke      = data;
        saveBtn.disabled = false;
 
        // Success — clear the "Loading…" text
        status.textContent = '';
 
      // "catch" = if ANYTHING above goes wrong, do this instead
      } catch (err) {
 
        // Show a friendly red error message
        status.className   = 'error';
        status.textContent = '😕 Oops! Couldn\'t load a joke. Please try again.';
        console.error(err);   // technical details go to DevTools, not the user
 
      // "finally" = ALWAYS runs, success or error
      } finally {
 
        // Hide the spinner and turn the button back on
        spinner.style.display = 'none';
        btn.disabled          = false;
        btn.textContent       = 'Load Another Joke';
      }
    }
 
    // ═══════════════════════════════════
    //  EXTRA: Favourites with localStorage
    // ═══════════════════════════════════
    // localStorage only stores TEXT, so:
    //   saving  → JSON.stringify (object → text)
    //   loading → JSON.parse     (text → object)
 
    // Read the saved list (or an empty list if nothing saved yet)
    function getFavourites() {
      return JSON.parse(localStorage.getItem('favourites')) || [];
    }
 
    // Save the current joke into the list
    function saveFavourite() {
      const favs = getFavourites();
 
      // Don't save the same joke twice (check by its id)
      const alreadySaved = favs.some(joke => joke.id === currentJoke.id);
      if (!alreadySaved) {
        favs.push(currentJoke);                                  // add to list
        localStorage.setItem('favourites', JSON.stringify(favs)); // store it
      }
 
      showFavourites();   // update the list on the page
      document.getElementById('save-btn').disabled = true;  // already saved
    }
 
    // Draw the favourites list on the page
    function showFavourites() {
      const list = document.getElementById('fav-list');
      const favs = getFavourites();
 
      // Nothing saved yet? Show a hint instead
      if (favs.length === 0) {
        list.innerHTML = '<span>No favourites yet.</span>';
        return;
      }
 
      // Turn each saved joke into an <li> and join them together
      list.innerHTML = favs
        .map(joke => `<li>${joke.setup}<br><span>${joke.punchline}</span></li>`)
        .join('');
    }
 
    // Show saved favourites as soon as the page opens
    showFavourites();
  </script>
 
</body>
</html>
