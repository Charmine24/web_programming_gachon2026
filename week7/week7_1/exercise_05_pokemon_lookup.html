<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 5 | Pokémon Lookup</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #fefce8; color: #422006; display: flex; justify-content: center; padding: 60px 16px; margin: 0; } .card { background: white; max-width: 480px; width: 100%; padding: 32px; border-radius: 16px; box-shadow: 0 4px 20px #00000014; text-align: center; } button { background: #ca8a04; color: white; border: 0; padding: 12px 24px; border-radius: 10px; cursor: pointer; } #pokemon { margin-top: 24px; } #pokemon img { width: 180px; image-rendering: pixelated; } #status { color: #854d0e; } .error { color: #dc2626 !important; }
  </style>
</head>
<body>
	<button class="back-button" type="button" onclick="history.back()">Back</button>
  <main class="card">
    <h1>⚡ Pokémon Lookup</h1>
    <p>Scenario: display a featured Pokémon in a game guide.</p>
    <button id="load-button">Find Pikachu</button>
    <section id="pokemon"></section><p id="status" aria-live="polite"></p>
  </main>
  <script>
    const button = document.querySelector("#load-button"), pokemon = document.querySelector("#pokemon"), status = document.querySelector("#status");
    button.addEventListener("click", async () => {
      button.disabled = true; status.className = ""; status.textContent = "Searching the Pokédex...";
      try {
        const response = await fetch("https://pokeapi.co/api/v2/pokemon/pikachu");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        pokemon.innerHTML = `<img src="${data.sprites.front_default}" alt="${data.name} sprite"><h2>${data.name}</h2><p>Pokédex number: ${data.id}</p>`;
        status.textContent = "";
      } catch (error) { status.className = "error"; status.textContent = "Pokémon data could not be loaded."; console.error(error); }
      finally { button.disabled = false; }
    });
  </script>
</body>
</html>
