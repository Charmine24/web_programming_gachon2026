<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- ============================================================
       STEP 2 — CSS Layout & Cards
       CSS variables, Flexbox search bar, Grid card layout
       ============================================================ -->
  <style>
    :root {
      --pink: #ff7eb6;
      --pink-dark: #ec5a9c;
      --pink-soft: #ffe3ef;
      --lavender: #c9b6ff;
      --lavender-soft: #f1ebff;
      --cream: #fff8fb;
      --text: #5a3d5c;
      --muted: #a58aa8;
      --card-bg: #ffffff;
      --radius: 22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Quicksand", system-ui, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 20%, var(--pink-soft) 0, transparent 40%),
        radial-gradient(circle at 90% 10%, var(--lavender-soft) 0, transparent 45%),
        radial-gradient(circle at 80% 90%, var(--pink-soft) 0, transparent 40%),
        var(--cream);
      background-attachment: fixed;
    }

    /* Header */
    header {
      text-align: center;
      padding: 50px 20px 30px;
      position: relative;
    }
    header h1 {
      font-family: "Pacifico", cursive;
      font-weight: 400;
      font-size: clamp(2.4rem, 7vw, 3.6rem);
      background: linear-gradient(90deg, var(--pink-dark), #b48cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.3;
    }
    header p {
      color: var(--muted);
      font-weight: 600;
      margin-top: 6px;
    }

    /* Sparkles — static decoration, no animation */
    .sparkle {
      position: absolute;
      font-size: 1.6rem;
    }
    .sparkle.s1 { top: 30px;  left: 18%; }
    .sparkle.s2 { top: 70px;  right: 17%; }
    .sparkle.s3 { top: 120px; left: 26%; font-size: 1.1rem; }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    /* Search bar — Flexbox */
    #search-form {
      display: flex;
      gap: 10px;
      max-width: 640px;
      margin: 0 auto 18px;
      background: var(--card-bg);
      padding: 8px;
      border-radius: 999px;
      border: 2px solid var(--pink-soft);
      box-shadow: 0 10px 30px rgba(255, 126, 182, 0.25);
    }
    #search-input {
      flex: 1;
      min-width: 0;
      padding: 12px 20px;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 500;
      border: none;
      background: transparent;
      color: var(--text);
      outline: none;
    }
    #search-input::placeholder { color: #d3b5cf; }

    #search-btn {
      padding: 12px 28px;
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--pink), #b48cff);
      border: none;
      border-radius: 999px;
      cursor: pointer;
    }
    #search-btn:hover    { filter: brightness(0.95); }
    #search-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Results — CSS Grid */
    #results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 26px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(201, 182, 255, 0.35);
    }
    .card:hover {
      box-shadow: 0 8px 24px rgba(255, 126, 182, 0.45);
    }

    .card img,
    .no-cover {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: calc(var(--radius) - 8px);
      background: linear-gradient(135deg, var(--pink-soft), var(--lavender-soft));
    }
    .no-cover {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }

    .card-body { padding: 12px 6px 6px; }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .card-meta {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .card-meta .year {
      background: var(--pink-soft);
      color: var(--pink-dark);
      padding: 2px 10px;
      border-radius: 999px;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* STEP 6 — status message + skeleton cards (static, no shimmer) */
    #status {
      text-align: center;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 24px;
      min-height: 1.2em;
    }
    #status.error { color: var(--pink-dark); }

    .skeleton .no-cover,
    .skeleton .line {
      background: var(--pink-soft);
    }
    .skeleton .line {
      height: 12px;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .skeleton .line.short { width: 55%; background: var(--lavender-soft); }

    @media (max-width: 520px) {
      #search-btn { padding: 12px 18px; }
      .sparkle { display: none; }
    }
  </style>
  <link rel="stylesheet" href="../../style.css">
</head>
<body>
	<button class="back-button" type="button" onclick="history.back()">Back</button>

  <!-- ============================================================
       STEP 1 — HTML Structure
       Semantic HTML: header, form, results section
       ============================================================ -->
  <header>
    <span class="sparkle s1">✨</span>
    <span class="sparkle s2">🌸</span>
    <span class="sparkle s3">💖</span>
    <h1>Book Search</h1>
    <p>find your next favourite story ♡</p>
  </header>

  <main>
    <form id="search-form">
      <input
        type="text"
        id="search-input"
        placeholder="search a book title… ♡"
        required
      >
      <button type="submit" id="search-btn">Search ✨</button>
    </form>

    <p id="status"></p>

    <section id="results" aria-live="polite"></section>
  </main>

  <script>
    // ==========================================================
    // STEP 3 — JS DOM: Wire the Form
    // getElementById, addEventListener, preventDefault
    // ==========================================================
    const form    = document.getElementById('search-form');
    const input   = document.getElementById('search-input');
    const button  = document.getElementById('search-btn');
    const results = document.getElementById('results');
    const status  = document.getElementById('status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();               // stop the page from reloading
      const query = input.value.trim();
      if (!query) return;

      // STEP 6 — loading state
      button.disabled = true;
      button.textContent = 'Searching…';
      setStatus('');
      showSkeletons(6);

      try {
        const books = await searchBooks(query);

        if (books.length === 0) {
          results.innerHTML = '';
          setStatus(`No books found for "${query}" 🥺 Try another title!`);
        } else {
          renderBooks(books);
          setStatus(`${books.length} books found for "${query}" 💕`);
        }
      } catch (error) {
        console.error(error);
        results.innerHTML = '';
        setStatus('Oops! Something went wrong. Please check your connection and try again.', true);
      } finally {
        // Runs whether it succeeded or failed
        button.disabled = false;
        button.textContent = 'Search ✨';
      }
    });

    // ==========================================================
    // STEP 4 — Fetch: Call the API
    // fetch() → check res.ok → parse JSON
    // ==========================================================
    async function searchBooks(query) {
      const url = 'https://openlibrary.org/search.json?q='
                + encodeURIComponent(query) + '&limit=12';

      const res = await fetch(url);
      if (!res.ok) {
        throw new Error('HTTP error: ' + res.status);
      }

      const data = await res.json();
      return data.docs;                     // array of book objects
    }

    // ==========================================================
    // STEP 5 — Render: Display Cards
    // createElement → set content → appendChild
    // ==========================================================
    function renderBooks(books) {
      results.innerHTML = '';               // clear old results / skeletons

      books.forEach((book) => {
        const card = document.createElement('article');
        card.className = 'card';

        // Cover: cover_i may be undefined — check first!
        if (book.cover_i) {
          const img = document.createElement('img');
          img.src = 'https://covers.openlibrary.org/b/id/' + book.cover_i + '-M.jpg';
          img.alt = 'Cover of ' + book.title;
          img.loading = 'lazy';
          card.appendChild(img);
        } else {
          const placeholder = document.createElement('div');
          placeholder.className = 'no-cover';
          placeholder.textContent = '📚';
          card.appendChild(placeholder);
        }

        const body = document.createElement('div');
        body.className = 'card-body';

        const title = document.createElement('h3');
        title.className = 'card-title';
        title.textContent = book.title;

        const meta = document.createElement('p');
        meta.className = 'card-meta';

        const author = document.createElement('span');
        author.textContent = book.author_name ? book.author_name[0] : 'Unknown author';

        const year = document.createElement('span');
        year.className = 'year';
        year.textContent = book.first_publish_year || 'n.d.';

        meta.appendChild(author);
        meta.appendChild(year);

        body.appendChild(title);
        body.appendChild(meta);
        card.appendChild(body);
        results.appendChild(card);
      });
    }

    // ==========================================================
    // STEP 6 — Bonus: Loading & Errors
    // Skeleton cards, disabled button, empty-state message
    // ==========================================================
    function showSkeletons(count) {
      results.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const card = document.createElement('div');
        card.className = 'card skeleton';
        card.innerHTML = `
          <div class="no-cover"></div>
          <div class="card-body">
            <div class="line"></div>
            <div class="line short"></div>
          </div>`;
        results.appendChild(card);
      }
    }

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('error', isError);
    }
  </script>
</body>
</html>
