<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 6 | Country Card</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #ecfdf5; color: #064e3b; display: flex; justify-content: center; padding: 60px 16px; margin: 0; } .card { background: white; max-width: 480px; width: 100%; padding: 32px; border-radius: 16px; box-shadow: 0 4px 20px #00000014; text-align: center; } button { background: #059669; color: white; border: 0; padding: 12px 24px; border-radius: 10px; cursor: pointer; } #country { margin-top: 24px; } #country img { width: 180px; border: 1px solid #d1fae5; } #status { color: #047857; } .error { color: #dc2626 !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🌍 Country Explorer</h1>
    <p>Scenario: give travelers a quick introduction to South Korea.</p>
    <button id="load-button">Explore Korea</button>
    <section id="country"></section><p id="status" aria-live="polite"></p>
  </main>
  <script>
    const button = document.querySelector("#load-button"), country = document.querySelector("#country"), status = document.querySelector("#status");
    button.addEventListener("click", async () => {
      button.disabled = true; status.className = ""; status.textContent = "Loading country information...";
      try {
        const response = await fetch("https://restcountries.com/v3.1/name/korea");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json(), place = data[0];
        country.innerHTML = `<img src="${place.flags.svg}" alt="Flag of ${place.name.common}"><h2>${place.name.common}</h2><p>Capital: ${place.capital[0]}</p><p>Region: ${place.region} · Population: ${place.population.toLocaleString()}</p>`;
        status.textContent = "";
      } catch (error) { status.className = "error"; status.textContent = "Country information could not be loaded."; console.error(error); }
      finally { button.disabled = false; }
    });
  </script>
</body>
</html>
