<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gachon Registration</title>
  <style>
    body {
      font-family: system-ui;
      padding: 24px;
      max-width: 420px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-top: 14px;
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 9px 12px;
      font-size: 14px;
      border: 2px solid #c8d4f0;
      border-radius: 8px;
    }

    input:focus {
      border-color: #1a56db;
      outline: none;
    }

    button {
      margin-top: 16px;
      padding: 10px 20px;
      background: #1a56db;
      color: white;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
  <style>
    /* Back button: same look as .back-button in style.css */
    .back-button { position: fixed; top: 20px; left: 20px; z-index: 10; display: inline-flex; width: 96px; height: 40px; margin: 0; align-items: center; justify-content: center; padding: 0; border: 1px solid #d8eaf3; border-radius: 999px; color: #3f4661; background: #fffefe; cursor: pointer; font: 700 .86rem/1 "Trebuchet MS", sans-serif; text-align: center; appearance: none; }
    .back-button:hover, .back-button:focus-visible { border-color: #b46682; color: #b46682; }
    body { padding-top: 76px; }
  </style>
</head>
<body>
  <button class="back-button" type="button" onclick="history.back()">Back</button>
  <h2>Gachon Registration</h2>

  <form method="post" action="/register">

    <label for="sid">Student ID</label>
    <input
      type="text"
      id="sid"
      name="student_id"
      placeholder="202112345"
      pattern="\d{9}"
      title="Student ID must be exactly 9 digits (e.g. 202112345)"
      required
    >

    <label for="r-email">Email</label>
    <input
      type="email"
      id="r-email"
      name="email"
      placeholder="name@gachon.ac.kr"
      required
    >

    <label for="r-pw">Password</label>
    <input
      type="password"
      id="r-pw"
      name="password"
      placeholder="At least 8 characters"
      minlength="8"
      required
    >

    <label for="r-age">Age</label>
    <input
      type="number"
      id="r-age"
      name="age"
      placeholder="Your age"
      min="16"
      max="100"
      required
    >

    <button type="submit">Register</button>

  </form>
</body>
</html>
