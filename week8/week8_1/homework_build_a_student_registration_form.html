<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #f4f6fb;
      color: #1f2937;
      margin: 0;
      padding: 32px 16px;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      background: #ffffff;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
      color: #1a56db;
    }

    fieldset {
      border: 1px solid #d6dff3;
      border-radius: 10px;
      padding: 8px 18px 18px;
      margin: 0 0 20px;
    }

    legend {
      font-weight: 700;
      color: #1a56db;
      padding: 0 6px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-top: 14px;
      margin-bottom: 4px;
    }

    input,
    select {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      border: 2px solid #c8d4f0;
      border-radius: 8px;
      background: #ffffff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .hint {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }

    /* ---------- Validation states ---------- */

    /* Valid and not empty: green */
    input:valid:not(:placeholder-shown) {
      border-color: #16a34a;
    }

    /* Invalid and not empty: red */
    input:invalid:not(:placeholder-shown) {
      border-color: #dc2626;
    }

    /* Dropdown: green once a major is chosen */
    select:valid {
      border-color: #16a34a;
    }

    /* Focus: blue ring */
    input:focus,
    select:focus {
      box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.35);
    }

    /* ---------- Checkbox ---------- */

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .checkbox-row input {
      width: auto;
      accent-color: #1a56db;
    }

    .checkbox-row label {
      margin: 0;
      font-weight: 500;
      font-size: 14px;
    }

    /* ---------- Range slider ---------- */

    .range-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="range"] {
      padding: 0;
      border: none;
      accent-color: #1a56db;
    }

    output {
      min-width: 70px;
      font-weight: 700;
      color: #1a56db;
    }

    /* ---------- Button ---------- */

    button {
      width: 100%;
      padding: 12px;
      background: #1a56db;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #1544b0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Student Registration</h1>

    <form method="post" action="/register">

      <!-- ===== Personal Info ===== -->
      <fieldset>
        <legend>Personal Info</legend>

        <label for="full-name">Full Name</label>
        <input
          type="text"
          id="full-name"
          name="full_name"
          placeholder="Hong Gildong"
          required
        >

        <label for="student-id">Student ID</label>
        <input
          type="text"
          id="student-id"
          name="student_id"
          placeholder="202112345"
          pattern="\d{9}"
          title="Student ID must be exactly 9 digits (e.g. 202112345)"
          required
        >

        <label for="dob">Date of Birth</label>
        <input
          type="date"
          id="dob"
          name="dob"
        >

        <label for="major">Major</label>
        <select id="major" name="major" required>
          <option value="" disabled selected>Select your major</option>
          <option value="cs">Computer Science</option>
          <option value="se">Software Engineering</option>
          <option value="ai">Artificial Intelligence</option>
          <option value="ee">Electrical Engineering</option>
          <option value="business">Business Administration</option>
        </select>

        <label for="experience">Years of Coding Experience</label>
        <div class="range-row">
          <input
            type="range"
            id="experience"
            name="experience"
            min="0"
            max="10"
            step="1"
            value="0"
          >
          <output id="experience-value" for="experience">0 years</output>
        </div>
      </fieldset>

      <!-- ===== Account Info ===== -->
      <fieldset>
        <legend>Account Info</legend>

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="name@gachon.ac.kr"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="At least 8 characters"
          minlength="8"
          required
        >

        <label for="phone">Phone</label>
        <input
          type="text"
          id="phone"
          name="phone"
          placeholder="010-1234-5678"
          pattern="\d{3}-\d{4}-\d{4}"
          title="Format: 010-1234-5678"
        >
        <p class="hint">Format: 010-1234-5678</p>
      </fieldset>

      <!-- ===== Terms ===== -->
      <div class="checkbox-row">
        <input
          type="checkbox"
          id="terms"
          name="terms"
          required
        >
        <label for="terms">I agree to the terms</label>
      </div>

      <button type="submit">Register</button>

    </form>
  </div>

  <script>
    // Bonus: live display of the slider value
    const slider = document.getElementById("experience");
    const display = document.getElementById("experience-value");

    function updateExperience() {
      const years = slider.value;
      display.textContent = years + (years === "1" ? " year" : " years");
    }

    slider.addEventListener("input", updateExperience);
    updateExperience();
  </script>
</body>
</html>
