<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Validation Styles Demo</title>
  <style>
    body {
      font-family: system-ui;
      padding: 24px;
      max-width: 400px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-top: 14px;
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 2px solid #c8d4f0;
      border-radius: 8px;
      outline: none;
      transition: all 0.2s;
    }

    button {
      margin-top: 16px;
      padding: 11px 24px;
      background: #1a56db;
      color: white;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    /* ADD YOUR CSS VALIDATION STYLES BELOW */

    /* Valid and not empty: green border */
    input:valid:not(:placeholder-shown) {
      border-color: #16a34a;
    }

    /* Invalid and not empty: red border */
    input:invalid:not(:placeholder-shown) {
      border-color: #dc2626;
    }

    /* Focus: blue outline */
    input:focus {
      outline: 3px solid #1a56db;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <h2>Validation Styles Demo</h2>

  <form>

    <label for="v-email">Email (required)</label>
    <input
      type="email"
      id="v-email"
      placeholder="name@example.com"
      required
    >

    <label for="v-pw">Password (min 8 chars)</label>
    <input
      type="password"
      id="v-pw"
      placeholder="At least 8 characters"
      minlength="8"
      required
    >

    <label for="v-age">Age (18–65)</label>
    <input
      type="number"
      id="v-age"
      placeholder="Your age"
      min="18"
      max="65"
      required
    >

    <button type="submit">Check Validation</button>

  </form>
</body>
</html>
