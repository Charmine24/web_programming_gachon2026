<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fruit Loop</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f6f3ee;
      color: #222;
      padding: 16px;
    }
    .card {
      background: #fff;
      width: 100%;
      max-width: 440px;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 4px; font-size: 26px; text-align: center; }
    h2 { font-size: 17px; margin: 24px 0 10px; color: #444; }
    p.sub { margin: 0 0 8px; color: #666; text-align: center; }
    .row { display: flex; gap: 8px; }
    input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
    }
    input:focus { outline: none; border-color: #e07a2e; }
    button {
      padding: 10px 16px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #e07a2e;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #c4651f; }
    button.secondary { background: #888; }
    button.secondary:hover { background: #666; }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      padding: 10px 14px;
      margin-bottom: 6px;
      border-radius: 8px;
      background: #fff4e8;
      font-size: 17px;
    }
    li.step { background: #eef3fb; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Fruit Loop</h1>
    <p class="sub">JavaScript loops in action</p>

    <h2>1. Repeat 5 times</h2>
    <ul id="steps"></ul>

    <h2>2. Loop through an array</h2>
    <div class="row">
      <input type="text" id="newFruit" placeholder="Add a fruit, e.g. mango">
      <button onclick="addFruit()">Add</button>
    </div>
    <ul id="fruitList" style="margin-top: 12px;"></ul>
    <button class="secondary" onclick="resetFruits()" style="margin-top: 8px;">Reset</button>
  </div>

  <script>
    // Repeat 5 times
    let stepList = document.getElementById('steps');
    for (let i = 1; i <= 5; i++) {
      console.log('Step ' + i);
      let item = document.createElement('li');
      item.className = 'step';
      item.textContent = 'Step ' + i;
      stepList.appendChild(item);
    }

    // Loop through an array
    let fruits = ['apple', 'banana', 'cherry'];

    function showFruits() {
      let list = document.getElementById('fruitList');
      list.innerHTML = '';
      for (let fruit of fruits) {
        console.log(fruit);
        let item = document.createElement('li');
        item.textContent = fruit;
        list.appendChild(item);
      }
    }

    function addFruit() {
      let input = document.getElementById('newFruit');
      let fruit = input.value.trim();
      if (fruit !== '') {
        fruits.push(fruit);
        showFruits();
      }
      input.value = '';
      input.focus();
    }

    function resetFruits() {
      fruits = ['apple', 'banana', 'cherry'];
      showFruits();
    }

    // Let the Enter key add a fruit too
    document.getElementById('newFruit').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') addFruit();
    });

    showFruits();
  </script>
</body>
</html>
