<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homework Step 3 | Cart Sidebar</title>
  <style>
    * { box-sizing: border-box; }
    body { max-width: 1000px; margin: 0 auto; padding: 2rem 1rem; color: #1f2937; background: #f6f7fb; font: 1rem/1.5 system-ui, sans-serif; }
    .task { color: #4b5563; }
    .layout { display: grid; gap: 1.5rem; grid-template-columns: 1fr 280px; align-items: start; }
    .product-list { display: grid; gap: .75rem; margin: 0; padding: 0; list-style: none; }
    .product-row { display: flex; align-items: center; gap: .75rem; padding: .6rem; border: 1px solid #e2e5ee; border-radius: 10px; background: #fff; }
    .product-row img { width: 64px; height: 48px; border-radius: 6px; object-fit: cover; background: #e5e7eb; }
    .product-row span { flex: 1; }
    button { padding: .35rem .7rem; border: 1px solid #1f9fbf; border-radius: 6px; color: #fff; background: #1f9fbf; font: inherit; cursor: pointer; }
    .cart-panel { position: sticky; top: 1rem; padding: 1rem; border: 1px solid #e2e5ee; border-radius: 10px; background: #fff; }
    .cart-panel h2 { margin: 0 0 .6rem; font-size: 1.15rem; }
    .cart-panel ul { margin: 0; padding: 0; list-style: none; }
    .cart-panel li { display: flex; justify-content: space-between; padding: .35rem 0; border-bottom: 1px solid #eef0f5; }
    .total { display: flex; justify-content: space-between; margin: .8rem 0 0; font-weight: 700; }
    .empty { color: #6b7280; }
    @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } .cart-panel { position: static; } }
  </style>
  <style>
    /* Back button: same look as .back-button in style.css */
    .back-button { position: fixed; top: 20px; left: 20px; z-index: 10; display: inline-flex; width: 96px; height: 40px; margin: 0; align-items: center; justify-content: center; padding: 0; border: 1px solid #d8eaf3; border-radius: 999px; color: #3f4661; background: #fffefe; cursor: pointer; font: 700 .86rem/1 "Trebuchet MS", sans-serif; text-align: center; appearance: none; }
    .back-button:hover, .back-button:focus-visible { border-color: #b46682; color: #b46682; }
    body { padding-top: 76px; }
  </style>
</head>
<body>
  <button class="back-button" type="button" onclick="history.back()">Back</button>
  <h1>Step 3 · Cart sidebar</h1>
  <p class="task">Requirement: a sidebar showing the cart items and the total price, computed from state.</p>
  <main class="layout">
    <ul class="product-list" id="product-list"></ul>
    <aside class="cart-panel" id="cart-panel" aria-label="Shopping cart"></aside>
  </main>
  <script>
    const products = [
      { id: 1, name: 'Coffee', price: 4500, image: 'https://placehold.co/400x260/6f4e37/ffffff?text=Coffee' },
      { id: 2, name: 'Sandwich', price: 7000, image: 'https://placehold.co/400x260/e0a458/ffffff?text=Sandwich' },
      { id: 3, name: 'Water', price: 1000, image: 'https://placehold.co/400x260/4aa3df/ffffff?text=Water' },
      { id: 4, name: 'Croissant', price: 3500, image: 'https://placehold.co/400x260/c98b3c/ffffff?text=Croissant' },
      { id: 5, name: 'Green Tea', price: 4000, image: 'https://placehold.co/400x260/5a8f3c/ffffff?text=Green+Tea' },
    ];

    let cart = []; // state: array of cart items

    const formatPrice = (price) => `₩${price.toLocaleString('ko-KR')}`;

    function addToCart(id) {
      if (cart.some((item) => item.id === id)) return;
      const product = products.find((p) => p.id === id);
      cart = [...cart, { id: product.id, name: product.name, price: product.price }];
      render();
    }

    // Component: cart sidebar. The total is DERIVED from state, never stored separately.
    function CartPanel({ cartItems }) {
      const total = cartItems.reduce((sum, item) => sum + item.price, 0);
      const items = cartItems.length
        ? `<ul>${cartItems.map((item) => `<li><span>${item.name}</span><span>${formatPrice(item.price)}</span></li>`).join('')}</ul>`
        : '<p class="empty">Your cart is empty.</p>';
      return `<h2>Cart (${cartItems.length})</h2>${items}<p class="total"><span>Total</span><span>${formatPrice(total)}</span></p>`;
    }

    function render() {
      document.getElementById('product-list').innerHTML = products.map((product) => `
        <li class="product-row">
          <img src="${product.image}" alt="${product.name}">
          <span><strong>${product.name}</strong><br>${formatPrice(product.price)}</span>
          <button type="button" data-add="${product.id}">Add</button>
        </li>`).join('');
      document.getElementById('cart-panel').innerHTML = CartPanel({ cartItems: cart });
    }

    document.getElementById('product-list').addEventListener('click', (event) => {
      if (event.target.dataset.add) addToCart(Number(event.target.dataset.add));
    });

    render();
  </script>
</body>
</html>
