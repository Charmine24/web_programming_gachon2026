<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homework Step 1 | Product List</title>
  <style>
    * { box-sizing: border-box; }
    body { max-width: 1000px; margin: 0 auto; padding: 2rem 1rem; color: #1f2937; background: #f6f7fb; font: 1rem/1.5 system-ui, sans-serif; }
    .task { color: #4b5563; }
    .product-list { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); margin: 0; padding: 0; list-style: none; }
    .product-card { overflow: hidden; border: 1px solid #e2e5ee; border-radius: 10px; background: #fff; }
    .product-card img { display: block; width: 100%; height: 120px; object-fit: cover; background: #e5e7eb; }
    .product-card h2 { margin: .75rem .85rem .2rem; font-size: 1.05rem; }
    .product-card p { margin: 0 .85rem .85rem; color: #4b5563; }
  </style>
  <style>
    /* Back button: same look as .back-button in style.css */
    .back-button { position: fixed; top: 20px; left: 20px; z-index: 10; display: inline-flex; width: 96px; height: 40px; margin: 0; align-items: center; justify-content: center; padding: 0; border: 1px solid #d8eaf3; border-radius: 999px; color: #3f4661; background: #fffefe; cursor: pointer; font: 700 .86rem/1 "Trebuchet MS", sans-serif; text-align: center; appearance: none; }
    .back-button:hover, .back-button:focus-visible { border-color: #b46682; color: #b46682; }
    body { padding-top: 76px; }
  </style>
</head>
<body>
  <button class="back-button" type="button" onclick="history.back()">Back</button>
  <h1>Step 1 · Product list</h1>
  <p class="task">Requirement: at least 5 items, each with a name, price and image URL.</p>
  <main><ul class="product-list" id="product-list"></ul></main>
  <script>
    // Product data: name, price and image URL for each item
    const products = [
      { id: 1, name: 'Coffee', price: 4500, image: 'https://placehold.co/400x260/6f4e37/ffffff?text=Coffee' },
      { id: 2, name: 'Sandwich', price: 7000, image: 'https://placehold.co/400x260/e0a458/ffffff?text=Sandwich' },
      { id: 3, name: 'Water', price: 1000, image: 'https://placehold.co/400x260/4aa3df/ffffff?text=Water' },
      { id: 4, name: 'Croissant', price: 3500, image: 'https://placehold.co/400x260/c98b3c/ffffff?text=Croissant' },
      { id: 5, name: 'Green Tea', price: 4000, image: 'https://placehold.co/400x260/5a8f3c/ffffff?text=Green+Tea' },
      { id: 6, name: 'Cheesecake', price: 6500, image: 'https://placehold.co/400x260/d9b44a/ffffff?text=Cheesecake' },
    ];

    const formatPrice = (price) => `₩${price.toLocaleString('ko-KR')}`;

    // Component: one product card (props: product)
    const ProductCard = ({ product }) => `
      <li class="product-card">
        <img src="${product.image}" alt="${product.name}">
        <h2>${product.name}</h2>
        <p>${formatPrice(product.price)}</p>
      </li>`;

    // List rendering: map each product to a card
    document.getElementById('product-list').innerHTML = products.map((product) => ProductCard({ product })).join('');
  </script>
</body>
</html>
