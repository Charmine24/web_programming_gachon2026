<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 1 | Toggle Detail</title>
  <style>
    body { max-width: 640px; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 sans-serif; }
    button { padding: 6px 12px; cursor: pointer; }
  </style>
  <style>
    /* Back button: same look as .back-button in style.css */
    .back-button { position: fixed; top: 20px; left: 20px; z-index: 10; display: inline-flex; width: 96px; height: 40px; margin: 0; align-items: center; justify-content: center; padding: 0; border: 1px solid #d8eaf3; border-radius: 999px; color: #3f4661; background: #fffefe; cursor: pointer; font: 700 .86rem/1 "Trebuchet MS", sans-serif; text-align: center; appearance: none; }
    .back-button:hover, .back-button:focus-visible { border-color: #b46682; color: #b46682; }
    body { padding-top: 76px; }
  </style>
</head>
<body>
  <button class="back-button" type="button" onclick="history.back()">Back</button>
  <h1>Toggle Detail</h1>
  <main id="app"></main>
  <script>
    // A button toggles the visibility of a paragraph using boolean state.
    let isVisible = false;
    const app = document.getElementById('app');

    function render() {
      app.innerHTML = `
        <button type="button" aria-expanded="${isVisible}">${isVisible ? 'Hide details' : 'Show details'}</button>
        ${isVisible ? '<p>React state enables dynamic UIs without page reloads.</p>' : ''}`;
      app.querySelector('button').addEventListener('click', () => {
        isVisible = !isVisible;
        render();
      });
    }

    render();
  </script>
</body>
</html>
