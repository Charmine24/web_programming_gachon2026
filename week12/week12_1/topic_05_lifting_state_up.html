<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Topic 5 | Lifting State Up</title>
  <style>
    body { max-width: 640px; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 sans-serif; }
    input { margin-left: 6px; padding: 4px 6px; font: inherit; }
  </style>
  <style>
    /* Back button: same look as .back-button in style.css */
    .back-button { position: fixed; top: 20px; left: 20px; z-index: 10; display: inline-flex; width: 96px; height: 40px; margin: 0; align-items: center; justify-content: center; padding: 0; border: 1px solid #d8eaf3; border-radius: 999px; color: #3f4661; background: #fffefe; cursor: pointer; font: 700 .86rem/1 "Trebuchet MS", sans-serif; text-align: center; appearance: none; }
    .back-button:hover, .back-button:focus-visible { border-color: #b46682; color: #b46682; }
    body { padding-top: 76px; }
  </style>
</head>
<body>
  <button class="back-button" type="button" onclick="history.back()">Back</button>
  <h1>Lifting State Up</h1>
  <p>When sibling components need the same data, the state moves to their nearest common parent. State flows <strong>down</strong> as props; events flow <strong>up</strong> as callbacks.</p>
  <main id="app"></main>
  <script>
    // Child receives a value and a callback through props
    function celsiusInput(root, { value, onChange }) {
      root.innerHTML = '<label>Celsius:<input type="number"></label>';
      const input = root.querySelector('input');
      input.value = value;
      input.addEventListener('input', (e) => onChange(Number(e.target.value)));
    }

    // Child that only displays the value it receives
    function fahrenheitDisplay(root, { celsius }) {
      const fahrenheit = (celsius * 9) / 5 + 32;
      root.textContent = `In Fahrenheit: ${fahrenheit.toFixed(1)}°F`;
    }

    // Parent holds the shared state
    function temperatureApp(root) {
      let celsius = 0;
      root.innerHTML = '<h2>Temperature Converter</h2><div id="input-slot"></div><p id="output-slot"></p>';
      const inputSlot = root.querySelector('#input-slot');
      const outputSlot = root.querySelector('#output-slot');
      const setCelsius = (next) => {
        celsius = next;
        fahrenheitDisplay(outputSlot, { celsius }); // re-render the child that depends on it
      };
      celsiusInput(inputSlot, { value: celsius, onChange: setCelsius });
      fahrenheitDisplay(outputSlot, { celsius });
    }

    temperatureApp(document.getElementById('app'));
  </script>
</body>
</html>
