<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Topic 4 | Multiple State Variables</title>
  <style>
    body { max-width: 640px; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 sans-serif; }
    form { display: grid; gap: 6px; max-width: 320px; }
    input, button { padding: 6px 8px; font: inherit; }
    .error { margin: 0; color: red; }
  </style>
</head>
<body>
  <h1>Multiple State Variables</h1>
  <p>A component can hold as many separate pieces of state as it needs. Each one is tracked independently.</p>
  <main id="app"></main>
  <script>
    // Separate state variables
    let name = '';
    let email = '';
    let isSubmit = false;
    let errors = {};

    const app = document.getElementById('app');

    function render() {
      if (isSubmit) {
        app.innerHTML = '<p></p>';
        app.querySelector('p').textContent = `Thank you, ${name}!`;
        return;
      }
      app.innerHTML = `
        <form novalidate>
          <input name="name" placeholder="Name" aria-label="Name">
          ${errors.name ? `<p class="error">${errors.name}</p>` : ''}
          <input name="email" type="email" placeholder="Email" aria-label="Email">
          ${errors.email ? `<p class="error">${errors.email}</p>` : ''}
          <button type="submit">Register</button>
        </form>`;
      const form = app.querySelector('form');
      const nameInput = form.querySelector('[name="name"]');
      const emailInput = form.querySelector('[name="email"]');
      nameInput.value = name;
      emailInput.value = email;
      nameInput.addEventListener('input', (e) => { name = e.target.value; });
      emailInput.addEventListener('input', (e) => { email = e.target.value; });
      form.addEventListener('submit', handleSubmit);
    }

    function handleSubmit(e) {
      e.preventDefault();
      const newErrors = {};
      if (!name) newErrors.name = 'Name is required';
      if (!email) newErrors.email = 'Email is required';

      if (Object.keys(newErrors).length > 0) {
        errors = newErrors;
        render();
        return;
      }
      isSubmit = true;
      render();
    }

    render();
  </script>
</body>
</html>
