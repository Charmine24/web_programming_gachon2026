<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homework Step 4 | Quantity Controls</title>
  <style>
    * { box-sizing: border-box; }
    body { max-width: 640px; margin: 0 auto; padding: 2rem 1rem; color: #1f2937; background: #f6f7fb; font: 1rem/1.5 system-ui, sans-serif; }
    .task { color: #4b5563; }
    .cart { padding: 1rem; border: 1px solid #e2e5ee; border-radius: 10px; background: #fff; }
    .cart ul { display: grid; gap: .6rem; margin: 0; padding: 0; list-style: none; }
    .cart li { display: flex; align-items: center; gap: .75rem; padding-bottom: .6rem; border-bottom: 1px solid #eef0f5; }
    .cart img { width: 56px; height: 42px; border-radius: 6px; object-fit: cover; background: #e5e7eb; }
    .name { flex: 1; }
    .qty { display: flex; align-items: center; gap: .5rem; }
    .qty button { width: 2rem; height: 2rem; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; font: inherit; cursor: pointer; }
    .qty button:disabled { cursor: not-allowed; opacity: .45; }
    .subtotal { min-width: 5.5rem; text-align: right; }
    .total { display: flex; justify-content: space-between; margin: .9rem 0 0; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Step 4 · Quantity controls</h1>
  <p class="task">Requirement: + and − buttons for each item in the cart.</p>
  <main class="cart" id="cart"></main>
  <script>
    const products = [
      { id: 1, name: 'Coffee', price: 4500, image: 'https://placehold.co/400x260/6f4e37/ffffff?text=Coffee' },
      { id: 2, name: 'Sandwich', price: 7000, image: 'https://placehold.co/400x260/e0a458/ffffff?text=Sandwich' },
      { id: 3, name: 'Water', price: 1000, image: 'https://placehold.co/400x260/4aa3df/ffffff?text=Water' },
      { id: 4, name: 'Croissant', price: 3500, image: 'https://placehold.co/400x260/c98b3c/ffffff?text=Croissant' },
      { id: 5, name: 'Green Tea', price: 4000, image: 'https://placehold.co/400x260/5a8f3c/ffffff?text=Green+Tea' },
    ];

    // State: array of cart items, each with a quantity
    let cart = products.map((product) => ({ id: product.id, quantity: 1 }));

    const formatPrice = (price) => `₩${price.toLocaleString('ko-KR')}`;
    const findProduct = (id) => products.find((p) => p.id === id);

    // map returns a NEW array; only the matching item gets a new object
    function changeQuantity(id, change) {
      cart = cart.map((item) =>
        item.id === id ? { ...item, quantity: Math.max(0, item.quantity + change) } : item);
      render();
    }

    function render() {
      const total = cart.reduce((sum, item) => sum + findProduct(item.id).price * item.quantity, 0);
      document.getElementById('cart').innerHTML = `
        <ul>${cart.map((item) => {
          const product = findProduct(item.id);
          return `
            <li>
              <img src="${product.image}" alt="${product.name}">
              <span class="name"><strong>${product.name}</strong><br>${formatPrice(product.price)}</span>
              <span class="qty">
                <button type="button" data-id="${item.id}" data-change="-1" aria-label="Decrease ${product.name}" ${item.quantity === 0 ? 'disabled' : ''}>−</button>
                <span>${item.quantity}</span>
                <button type="button" data-id="${item.id}" data-change="1" aria-label="Increase ${product.name}">+</button>
              </span>
              <span class="subtotal">${formatPrice(product.price * item.quantity)}</span>
            </li>`;
        }).join('')}</ul>
        <p class="total"><span>Total</span><span>${formatPrice(total)}</span></p>`;
    }

    document.getElementById('cart').addEventListener('click', (event) => {
      const { id, change } = event.target.dataset;
      if (id) changeQuantity(Number(id), Number(change));
    });

    render();
  </script>
</body>
</html>
