<body>
  <!-- Inline elements flow on the same line -->
  <p>
    Normal text,
    <strong>bold text</strong>,
    <em>italic text</em>,
    <a href="#">a link</a>,
    and <span class="highlight">highlighted text</span>
    all sit on ONE line.
  </p>

  <!-- span is invisible by default — CSS gives it style -->
  <style>
    .highlight { background: yellow; color: black; padding: 2px 4px; }
  </style>

  <!-- Wrong: block element inside inline -->
  <!-- <span><p>text</p></span> ← BAD! -->
</body>
