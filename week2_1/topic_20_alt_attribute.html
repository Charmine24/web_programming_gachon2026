<body>
  <!-- Good: describes what the image shows -->
  <img src="profile.jpg" alt="Yang Kaijing Charmine smiling in front of Gachon University main building">

  <!-- Decorative image: empty alt, screen reader skips it -->
  <img src="decorative-divider.png" alt="">

  <!-- Chart: describe the DATA, not the chart type -->
  <img src="grades-chart.png"
       alt="Bar chart showing quiz scores: Week 1: 82, Week 2: 88, Week 3: 91">

  <!-- BAD examples — avoid these -->

  <!-- <img src="photo.jpg" alt="photo">           not descriptive -->
  <!-- <img src="photo.jpg" alt="image of photo">  redundant -->
</body>
