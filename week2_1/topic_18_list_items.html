<body>
  <!-- Each item = one li -->
  <ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
  </ul>

  <!-- li can contain links, images, even nested lists -->
  <ul>
    <li>
      <a href="/html">HTML Guide</a>
      <ul>
        <li><a href="/html/tags">Core Tags</a></li>
        <li><a href="/html/forms">Forms</a></li>
      </ul>
    </li>
    <li><a href="/css">CSS Guide</a></li>
  </ul>

  <!-- Wrong — non-li elements directly in ul -->
  <!-- <ul><p>Item 1</p></ul> ← INVALID! -->
</body>
