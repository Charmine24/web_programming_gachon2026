<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<style>
  /* TODO: declare :root variables */
  :root {
    /* --primary: ... */
    --primary: #0f766e;
    /* --accent: ... */
    --accent:  #14b8a6;
    /* --bg: ... */
    --bg: #f0fdfa;
    /* --text: ... */
    --text:    #1e293b;
    /* --radius: ... */
    --radius:  12px;
  }

  /* TODO: dark mode media query */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #051a0a;
      --text: #d4edda;
    }
  }

  body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; }

  .btn {
    /* TODO: use var(--primary) for background */
    background: var(--primary);
    color: white;
    border: none;
    border-radius: var(--radius);
    padding: 10px 20px;
    cursor: pointer;
  }

  .btn:hover { background: var(--accent); }
  .card {
    /* TODO: use variables for background, border, border-radius */
    background: var(--bg);
    border: 2px solid var(--primary);
    border-radius: var(--radius);
    padding: 20px; margin-top: 16px;
  }
</style>
</head>
<body>
  <button class="btn">Click Me</button>
  <div class="card">A themed card using CSS variables</div>
</body>
</html>
