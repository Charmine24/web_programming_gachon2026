<style>
  /* Back button: same look as .back-button in style.css */
  .back-button { position: fixed; top: 20px; left: 20px; z-index: 10; display: inline-flex; width: 96px; height: 40px; margin: 0; align-items: center; justify-content: center; padding: 0; border: 1px solid #d8eaf3; border-radius: 999px; color: #3f4661; background: #fffefe; cursor: pointer; font: 700 .86rem/1 "Trebuchet MS", sans-serif; text-align: center; appearance: none; }
  .back-button:hover, .back-button:focus-visible { border-color: #b46682; color: #b46682; }
  body { padding-top: 76px; }
</style>
<button class="back-button" type="button" onclick="history.back()">Back</button>

<!-- Tab = forward · Shift+Tab = back · Enter/Space = activate · Arrows = inside widgets -->

<style>
  /* ✅ :focus-visible — shows focus ring for keyboard, not mouse clicks */
  :focus-visible {
    outline: 3px solid #1a7f5a;
    outline-offset: 3px;
    border-radius: 4px;
  }

  /* ❌ Never do this — removes focus for keyboard users! */
  /* *:focus { outline: none; } */
</style>

<!-- tabindex="0" — adds element to natural tab order -->
<div role="button" tabindex="0" onclick="..." onkeydown="...">
  Custom widget
</div>

<!-- tabindex="-1" — focusable via JS but not by Tab key -->
<div id="modal" tabindex="-1">...</div>

<!-- Skip navigation link — lets keyboard users jump past nav -->
<a href="#main-content" class="skip-link">Skip to main content</a>
<nav>...</nav>
<main id="main-content">...</main>
