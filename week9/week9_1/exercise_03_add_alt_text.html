<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Proper alt Text to Images</title>
  <style>
    body {
      font-family: system-ui;
      padding: 24px;
      max-width: 500px;
    }

    .img-placeholder {
      width: 100%;
      height: 80px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 6px;
      border: 2px dashed #999;
    }

    .label {
      font-size: 12px;
      color: #666;
      margin-bottom: 14px;
    }

    button {
      background: #1a7f5a;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    button:focus-visible {
      outline: 3px solid #1a7f5a;
      outline-offset: 3px;
    }

    /* Placeholder <img src=""> tags stay in the accessibility tree but are not drawn
       (display:none would also hide the linked image's alt from screen readers) */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    #feedback {
      margin-top: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <!-- Image 1: informational — describe what the photo shows -->
  <div class="img-placeholder" style="background:#e0eaff" aria-hidden="true">🏫</div>
  <img src="" alt="Gachon University main building, a modern glass structure surrounded by trees" class="visually-hidden">
  <p class="label">Image 1: Campus building photo (informational)</p>

  <!-- Image 2: decorative — empty alt so screen readers skip it -->
  <div class="img-placeholder" style="background:#f0fdf4" aria-hidden="true">〰️</div>
  <img src="" alt="" class="visually-hidden">
  <p class="label">Image 2: Decorative wavy divider</p>

  <!-- Image 3: linked image — describe the link destination -->
  <div class="img-placeholder" style="background:#fef3c7" aria-hidden="true">🏫</div>
  <a href="/"><img src="" alt="Gachon University — go to homepage" class="visually-hidden"></a>
  <p class="label">Image 3: University logo (inside a link to homepage)</p>

  <!-- Image 4: chart — give the key data -->
  <div class="img-placeholder" style="background:#f5f0ff" aria-hidden="true">📊</div>
  <img src="" alt="Bar chart showing student enrollment: 2024: 1,200 students; 2025: 1,400 students; 2026: 1,476 students" class="visually-hidden">
  <p class="label">Image 4: Enrollment chart: 2024: 1,200 | 2025: 1,400 | 2026: 1,476 students</p>

  <button type="button" onclick="checkAlts()">Check my alt text</button>
  <div id="feedback" aria-live="polite"></div>

  <script>
    function checkAlts() {
      const imgs = document.querySelectorAll('img');
      const results = [];
      imgs.forEach((img, i) => {
        const alt = img.getAttribute('alt');
        if (alt === null) results.push(`❌ Image ${i + 1}: missing alt attribute`);
        else if (alt === 'image' || alt === 'logo' || alt === 'chart')
          results.push(`⚠️ Image ${i + 1}: alt="${alt}" is too generic`);
        else if (i === 1 && alt !== '')
          results.push(`⚠️ Image 2 should have alt="" (decorative)`);
        else results.push(`✅ Image ${i + 1}: alt="${alt}"`);
      });
      document.getElementById('feedback').innerHTML = results.join('<br>');
    }
  </script>
</body>
</html>
