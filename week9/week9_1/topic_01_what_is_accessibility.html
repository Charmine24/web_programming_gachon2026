<style>
  /* Back button: same look as .back-button in style.css */
  .back-button { position: fixed; top: 20px; left: 20px; z-index: 10; display: inline-flex; width: 96px; height: 40px; margin: 0; align-items: center; justify-content: center; padding: 0; border: 1px solid #d8eaf3; border-radius: 999px; color: #3f4661; background: #fffefe; cursor: pointer; font: 700 .86rem/1 "Trebuchet MS", sans-serif; text-align: center; appearance: none; }
  .back-button:hover, .back-button:focus-visible { border-color: #b46682; color: #b46682; }
  body { padding-top: 76px; }
</style>
<button class="back-button" type="button" onclick="history.back()">Back</button>

<!-- A11y = "accessibility" (11 letters between the A and the y) -->
<!-- Designing so people with disabilities can perceive, understand, navigate and interact with a site -->

<!-- Visual impairment (screen reader): use real buttons, not divs -->
<button type="button">Submit</button>

<!-- Motor disability (keyboard / switch access): logical tab order, large click targets -->
<a href="#main-content" class="skip-link">Skip to main content</a>

<!-- Cognitive differences: clear headings and short paragraphs -->
<h2>Opening hours</h2>
<p>Mon–Fri, 9am to 6pm.</p>

<!-- Hearing impairment: captions on videos, no autoplaying audio -->
<video src="lecture.mp4" controls>
  <track kind="captions" src="lecture-en.vtt" srclang="en" label="English">
</video>
