<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fix a div-button to a real button</title>
  <style>
    body {
      font-family: system-ui;
      padding: 24px;
    }

    .btn {
      display: inline-block;
      background: #1a7f5a;
      color: white;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      border: none;
    }

    /* Visible focus ring for keyboard users */
    .btn:focus-visible {
      outline: 3px solid #1a7f5a;
      outline-offset: 3px;
    }

    .close-btn {
      margin-left: 16px;
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 18px;
      cursor: pointer;
    }

    .close-btn:focus-visible {
      outline: 3px solid #dc2626;
      outline-offset: 3px;
    }

    #result {
      margin-top: 16px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <p>Try pressing Tab then Enter:</p>

  <!-- ✅ FIXED: div → real button (Tab-focusable, Enter/Space work, announced as "button") -->
  <button class="btn" type="button" onclick="alert('Clicked!')">
    Submit form
  </button>

  <!-- ✅ FIXED: icon-only button now has an accessible name -->
  <button class="close-btn" type="button" aria-label="Close" onclick="alert('Closed')">
    <span aria-hidden="true">✕</span>
  </button>

  <!-- aria-live so screen readers announce the result too -->
  <div id="result" aria-live="polite"></div>

  <script>
    // Log when each button is activated (click or keyboard)
    document.querySelectorAll('button').forEach(el => {
      el.addEventListener('click', () => {
        document.getElementById('result').textContent =
          '✅ Activated! (works by keyboard and mouse)';
      });
    });
  </script>
</body>
</html>
