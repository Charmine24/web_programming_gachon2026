<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Figures</title></head>
<body>
  <!-- Figure 1: image with figcaption -->
  <figure>
    <img src="https://picsum.photos/400/250?random=10" alt="Random decorative landscape placeholder image">
    <figcaption>Figure 1: A random scenic image loaded from Picsum Photos.</figcaption>
  </figure>

  <!-- Sentence with time element -->
  <p>This lab report was created on <time datetime="2026-09-11">September 11, 2026</time>.</p>

  <!-- Figure 2: pre+code block with figcaption -->
<figure>
    <pre><code>&lt;!DOCTYPE html&gt;
&lt;html lang="en"&gt;
&lt;head&gt;
  &lt;meta charset="UTF-8"&gt;
  &lt;title&gt;Document&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;/body&gt;
&lt;/html&gt;</code></pre>
    <figcaption>Figure 2: Standard HTML5 basic document skeleton structure.</figcaption>
  </figure>
</body>
</html>
